<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Android WebView applies algorithmic darkening (force dark) to pages that do
     not say which colour schemes they support, and Android TV runs a dark system
     theme. On the foyer Chromecast that inverted the newsletter slide: its sand
     background came out near-black and its brown text came out cream. Posters
     were untouched, because force dark never alters bitmaps, and the newsletter
     is the only slide drawn in the page rather than stored as an image. Saying
     only light here declares that this page paints its own colours and the
     browser must not second-guess them.

     Added 31 Aug 2026 for the Chromecast with Google TV in the foyer. Nothing
     else in this file depends on it: delete this tag to restore the previous
     behaviour exactly. On the Mac mini it changes nothing visible. -->
<meta name="color-scheme" content="only light">

<title>MOCA Foyer Screen</title>
<style>
  :root { --sand:#F5ECE4; --brown:#2E1505; --red:#B45B38; --line:#DCCFC3;
          --font:"Helvetica Neue", Helvetica, "PingFang HK", Arial, sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:#000; color:var(--brown); font-family:var(--font); -webkit-font-smoothing:antialiased; }

  #player { position:fixed; inset:0; background:#000; cursor:none; }
  .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           opacity:0; transition:opacity 600ms ease-in-out; }
  .slide.vis { opacity:1; }
  .slide > video { width:100%; height:100%; object-fit:contain; display:block; }
  .slide > img { max-width:100%; max-height:100%; width:auto; height:auto; display:block; }

  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            color:#6b5a4d; background:#000; font-size:26px; text-align:center; padding:8vw; line-height:1.6; }
  #status.gone { display:none; }

  #controls { position:fixed; top:26px; right:26px; z-index:20; display:flex; gap:12px;
              opacity:0; pointer-events:none; transition:opacity 260ms ease; }
  body.awake #controls { opacity:1; pointer-events:auto; }
  body.awake #player { cursor:default; }
  #controls button { font:600 15px var(--font); color:var(--brown); background:rgba(245,236,228,.94);
                     border:0; border-radius:9px; padding:12px 20px; cursor:pointer;
                     box-shadow:0 4px 18px rgba(0,0,0,.35); }
  #controls button:hover { background:#fff; }

  #tray { position:fixed; inset:0; background:var(--sand); overflow:auto; display:none; z-index:30; }
  #tray.on { display:block; }
  .wrap { max-width:1400px; margin:0 auto; padding:44px 48px 80px; }
  header { display:flex; align-items:baseline; gap:18px; }
  h1 { font-size:29px; font-weight:700; letter-spacing:-.02em; margin:0; }
  .cjk { font-size:15px; color:var(--red); }
  .card.live { border-color:var(--red); box-shadow:0 0 0 2px var(--red); }
  .tk { font-size:12px; font-weight:600; margin:4px 0 0; }
  .tk.on { color:var(--red); }
  .tk.off { color:#8b7a6c; }
  .bar { display:flex; align-items:center; gap:13px; margin:24px 0 8px; flex-wrap:wrap; }
  button.b { font:15px var(--font); border-radius:8px; border:1px solid var(--line);
             background:#fff; color:var(--brown); padding:11px 18px; cursor:pointer; }
  button.b:hover { border-color:var(--red); }
  button.b.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; padding:13px 28px; }
  button.b:disabled { opacity:.45; cursor:default; }
  .hold { display:flex; align-items:center; gap:8px; font-size:15px; }
  .hold input { width:64px; padding:10px; font:15px var(--font); border:1px solid var(--line);
                border-radius:8px; background:#fff; color:var(--brown); }
  .note { font-size:14px; color:#7d6a5c; margin:10px 0 0; line-height:1.6; max-width:76ch; }
  .note b { color:var(--brown); }
  .err { color:var(--red); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; margin-top:26px; }
  .card { border:1px solid var(--line); border-radius:12px; background:#fff; overflow:hidden; }
  .card.pinned { border-color:var(--red); }
  .card.off .thumb { opacity:.3; }
  .card.off .name { text-decoration:line-through; color:#9a8879; }
  .thumb { aspect-ratio:16/9; min-height:0; overflow:hidden; background:#000; position:relative;
           display:flex; align-items:center; justify-content:center; }
  .thumb > img { width:100%; height:100%; object-fit:contain; display:block; }
  .meta { padding:12px 14px; border-top:1px solid var(--line); }
  .name { font-size:13.5px; font-weight:600; margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dims { font-size:12px; color:#8b7a6c; margin:0; }
  .acts { padding:0 14px 13px; }
  .acts button { width:100%; font-size:13px; padding:8px 6px; }
  .pinbadge { font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
              color:var(--red); padding:0 14px 13px; margin:0; }

/* ---------- newsletter slide, drawn rather than embedded ----------------
   Laid out at the approved 3200x1600 and scaled to fit, so the proportions
   match the signed-off artwork exactly while staying crisp on a 4K panel. */

.nl-fit { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.nl {
  width:3200px; height:1600px; flex:none; display:flex;
  background:#F5ECE4; color:#2E1505;
  font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
  transform-origin:center center;
}
.nl-left { flex:1; padding:190px 0 170px 200px; display:flex; flex-direction:column; }

.nl-eyebrow {
  display:flex; align-items:center; gap:26px;
  font-size:52px; font-weight:300; letter-spacing:.30em; text-transform:uppercase;
  color:#B45B38; margin:0;
}
.nl-eyebrow i { width:26px; height:26px; background:#B45B38; flex:none; }
.nl-eyebrow s {
  text-decoration:none;
  font-family:"PingFang HK","PingFang TC","Noto Sans TC",sans-serif;
  letter-spacing:.16em; font-weight:300;
}

.nl h2 { font-size:248px; line-height:.98; font-weight:700; letter-spacing:-.035em; margin:62px 0 0; }
.nl h2 em { font-style:normal; color:#B45B38; }

.nl-sub { font-size:68px; line-height:1.32; font-weight:400; margin:60px 0 0; max-width:24ch; color:#4a2c14; }
.nl-spacer { flex:1; }
/* align-self stops the flex column stretching the box to full width, which
   would let the SVG centre itself inside it instead of sitting at the left */
.nl-logo { height:150px; width:auto; align-self:flex-start; display:block; }

.nl-right {
  width:1200px; background:#B45B38; color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:56px;
}
/* white card gives the code the quiet zone the source file lacks */
.nl-qr { background:#fff; padding:76px; border-radius:10px; }
.nl-qr img { display:block; width:800px; height:800px; image-rendering:pixelated; }

.nl-cta { font-size:92px; font-weight:300; letter-spacing:.04em; line-height:1; margin:0; text-align:center; }
.nl-cta s {
  text-decoration:none; display:block;
  font-family:"PingFang HK","PingFang TC","Noto Sans TC",sans-serif;
  font-size:74px; font-weight:300; letter-spacing:.12em; line-height:1; margin-top:26px; opacity:.92;
}
</style>
</head>
<body>

<div id="player"><div id="stage"></div></div>
<div id="status">Loading posters…</div>
<div id="controls"><button id="manageBtn">Manage</button></div>

<div id="tray">
  <div class="wrap">
    <header><h1>MOCA Foyer Screen</h1><span class="cjk">澳洲華人博物館</span></header>
    <div class="bar">
      <button class="b primary" id="resumeBtn">Back to the loop</button>
      <button class="b" id="refreshBtn">Check for changes now</button>
      <label class="hold">Hold each image <input id="hold" type="number" min="1" max="120" step="1"> seconds</label>
      <span class="note" id="count"></span>
    </div>
    <p class="note" id="trayNote"></p>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
/* ===================================================================
   MOCA Foyer Screen.

   Posters live in the "posters" folder of the GitHub repository this
   page is served from. Add or delete files there from any computer and
   the screen follows, taking the change up at the end of the current
   cycle so a poster is never cut off mid-show.

   The newsletter page is drawn by this file rather than stored as an
   image, so it stays sharp at any screen size.
=================================================================== */

/* On GitHub Pages the address is owner.github.io/repo, so the repository
   can be read from it and nothing needs configuring by hand. */
function detectRepo() {
  const host = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!host) return null;
  const owner = host[1];
  const first = location.pathname.split('/').filter(Boolean)[0];
  return { owner, name: first || `${owner}.github.io` };
}

const REPO = Object.assign(
  { branch:'main', dir:'posters' },
  detectRepo() || { owner:'Museum-of-Chinese-in-Australia', name:'moca-foyer-screen' }
);

/* Assets sit at the repository root, but this page may be served from a
   subfolder such as /preview/. Build an absolute prefix so one file works
   from either place without editing on promotion. */
const ASSET_PREFIX = (function () {
  const seg = location.pathname.match(/^\/[^/]+\//);
  if (location.hostname.toLowerCase().endsWith('github.io') && seg) return seg[0];
  return '/';
})();

/* Laid out at 3200x1600 then scaled to fit, which letterboxes it exactly
   as a 2:1 image would and keeps the approved proportions. */
function fitNewsletters() {
  document.querySelectorAll('.nl-fit').forEach(fit => {
    const nl = fit.firstElementChild;
    const r = fit.getBoundingClientRect();
    if (!r.width || !r.height) return;
    nl.style.transform = 'scale(' + Math.min(r.width / 3200, r.height / 1600) + ')';
  });
}

/* ---------- Sydney time and takeover filenames ------------------------ */

const TZ = 'Australia/Sydney';

/* How far Sydney is from UTC at a given instant. Read from the platform's
   timezone database via Intl, so daylight saving is never our problem. */
function tzOffsetMs(instant) {
  const p = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).formatToParts(instant).reduce((a, x) => (a[x.type] = x.value, a), {});
  const h = p.hour === '24' ? 0 : Number(p.hour);
  const asUTC = Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day),
                         h, Number(p.minute), Number(p.second));
  return asUTC - instant.getTime();
}

/* Turn a Sydney wall-clock reading into a real instant. Resolved twice so a
   time sitting near a daylight-saving change lands on the correct side. */
function sydneyInstant(y, mo, d, h, mi) {
  const naive = Date.UTC(y, mo - 1, d, h, mi);
  let t = naive - tzOffsetMs(new Date(naive));
  t = naive - tzOffsetMs(new Date(t));
  return t;
}

const TAKEOVER_RE = /^takeover-/i;

/* Today's date as Sydney sees it, for end-only filenames. */
function sydneyToday() {
  const p = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date()).reduce((a, x) => (a[x.type] = x.value, a), {});
  return [Number(p.year), Number(p.month), Number(p.day)];
}

/* takeover-<name>                          fires as soon as it is seen
   takeover-YYYYMMDD-HHMM                   starts then, runs until deleted
   takeover-YYYYMMDD-HHMM-HHMM              ends the same day
   takeover-YYYYMMDD-HHMM-YYYYMMDD-HHMM     ends on the given day
   Anything after the timestamps is ignored, so files can carry a description.
   A timestamp we cannot read falls back to firing immediately: a poster
   appearing early is noticed, one that silently never appears is not. */
function parseTakeover(name) {
  if (!TAKEOVER_RE.test(name)) return null;

  const body = name.replace(/\.[^.]+$/, '').replace(TAKEOVER_RE, '');
  const parts = body.split('-');

  const dOf = t => [Number(t.slice(0, 4)), Number(t.slice(4, 6)), Number(t.slice(6, 8))];
  const tOf = t => [Number(t.slice(0, 2)), Number(t.slice(2, 4))];
  const ok  = (h, mi) => h >= 0 && h <= 23 && mi >= 0 && mi <= 59;

  /* takeover-endYYYYMMDD-HHMM  and  takeover-endHHMM
     start immediately, stop at the stated time. */
  const em = /^end(\d{8}|\d{4})$/i.exec(parts[0] || '');
  if (em) {
    const v = em[1];
    let e = null;
    if (v.length === 8 && /^\d{4}$/.test(parts[1] || '')) {
      const [y, mo, d] = dOf(v);
      const [h, mi] = tOf(parts[1]);
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && ok(h, mi)) e = sydneyInstant(y, mo, d, h, mi);
    } else if (v.length === 4) {
      const [h, mi] = tOf(v);
      if (ok(h, mi)) {
        const [y, mo, d] = sydneyToday();
        e = sydneyInstant(y, mo, d, h, mi);
        if (e <= Date.now()) {            /* that hour has gone, so mean tomorrow */
          const nx = new Date(Date.UTC(y, mo - 1, d + 1));
          e = sydneyInstant(nx.getUTCFullYear(), nx.getUTCMonth() + 1, nx.getUTCDate(), h, mi);
        }
      }
    }
    return { start: null, end: (e !== null && isFinite(e)) ? e : null };
  }

  const tok = [];
  for (const t of body.split('-')) {
    if (/^\d{8}$/.test(t) || /^\d{4}$/.test(t)) tok.push(t);
    else break;
  }

  const asDate = t => [Number(t.slice(0, 4)), Number(t.slice(4, 6)), Number(t.slice(6, 8))];
  const asTime = t => [Number(t.slice(0, 2)), Number(t.slice(2, 4))];
  const sane = (h, mi) => h >= 0 && h <= 23 && mi >= 0 && mi <= 59;

  let start = null, end = null;

  if (tok.length >= 2 && tok[0].length === 8 && tok[1].length === 4) {
    const [y, mo, d] = asDate(tok[0]);
    const [h, mi] = asTime(tok[1]);
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && sane(h, mi)) {
      start = sydneyInstant(y, mo, d, h, mi);

      if (tok.length >= 4 && tok[2].length === 8 && tok[3].length === 4) {
        const [ey, emo, ed] = asDate(tok[2]);
        const [eh, emi] = asTime(tok[3]);
        if (sane(eh, emi)) end = sydneyInstant(ey, emo, ed, eh, emi);
      } else if (tok.length >= 3 && tok[2].length === 4) {
        const [eh, emi] = asTime(tok[2]);
        if (sane(eh, emi)) {
          end = sydneyInstant(y, mo, d, eh, emi);
          if (end <= start) {
            /* an end at or before the start reads as crossing midnight */
            const nx = new Date(Date.UTC(y, mo - 1, d + 1));
            end = sydneyInstant(nx.getUTCFullYear(), nx.getUTCMonth() + 1,
                                nx.getUTCDate(), eh, emi);
          }
        }
      }
    }
  }

  if (start !== null && !isFinite(start)) start = null;
  if (end !== null && !isFinite(end)) end = null;
  return { start, end };
}

function takeoverLive(tk, now) {
  if (!tk) return false;
  if (tk.start !== null && now < tk.start) return false;
  if (tk.end !== null && now >= tk.end) return false;
  return true;
}

const fmtSyd = t => new Intl.DateTimeFormat('en-AU', {
  timeZone: TZ, day: 'numeric', month: 'short',
  hour: '2-digit', minute: '2-digit', hour12: false
}).format(new Date(t));

/* An ordinary poster can carry its own expiry with a -until suffix, so an
   event poster comes down by itself when nobody remembers to remove it. The
   suffix sits at the END of the name so it never disturbs the leading sort
   key that decides play order.

     04-10sep-timperley-until20260911-0900.png   comes down 11 Sep 09:00
     04-10sep-timperley-until20260911.png        comes down at the end of 11 Sep

   Takeover files are untouched by this: they carry their own start and end. */
const UNTIL_RE = /-until(\d{8})(?:-(\d{4}))?$/i;

function parseUntil(name) {
  const m = UNTIL_RE.exec(name.replace(/\.[^.]+$/, ''));
  if (!m) return null;

  const y  = Number(m[1].slice(0, 4));
  const mo = Number(m[1].slice(4, 6));
  const d  = Number(m[1].slice(6, 8));
  if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;

  /* Reject a day that does not exist, such as 31 September. Left alone it
     would roll silently into the next month and take the poster down on a
     date nobody wrote. Failing to "never expires" keeps it on screen, which
     is the visible failure rather than the invisible one. */
  const probe = new Date(Date.UTC(y, mo - 1, d));
  if (probe.getUTCMonth() !== mo - 1 || probe.getUTCDate() !== d) return null;

  let t;
  if (m[2]) {
    const h = Number(m[2].slice(0, 2)), mi = Number(m[2].slice(2, 4));
    if (!(h >= 0 && h <= 23 && mi >= 0 && mi <= 59)) return null;
    t = sydneyInstant(y, mo, d, h, mi);
  } else {
    /* a date on its own means all of that day, so it ends at the next midnight */
    const nx = new Date(Date.UTC(y, mo - 1, d + 1));
    t = sydneyInstant(nx.getUTCFullYear(), nx.getUTCMonth() + 1, nx.getUTCDate(), 0, 0);
  }
  return isFinite(t) ? t : null;
}

const expired = (p, now) => p.until !== null && p.until !== undefined && now >= p.until;

/* ---------- reading the repo ----------------------------------------- */

const IMAGE_RE = /\.(png|jpe?g|gif|webp|avif)$/i;
const VIDEO_RE = /\.(mp4|webm|m4v)$/i;

async function fetchPosters() {
  const url = LOCAL_PREVIEW ? '/preview-playlist.json' : `https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${REPO.dir}?ref=${REPO.branch}`;
  const res = await fetch(url, { headers:{ 'Accept':'application/vnd.github+json' }, cache:'no-store' });
  if (res.status === 404) throw new Error(`No "${REPO.dir}" folder in ${REPO.owner}/${REPO.name}`);
  if (res.status === 403) throw new Error('GitHub rate limit reached, will retry shortly');
  if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
  const rows = await res.json();
  if (!Array.isArray(rows)) throw new Error(`"${REPO.dir}" is not a folder`);
  return rows
    .filter(r => r.type === 'file' && (IMAGE_RE.test(r.name) || VIDEO_RE.test(r.name)) && r.download_url)
    .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }))
    .map(r => ({ kind:VIDEO_RE.test(r.name) ? 'video' : 'image', name:r.name, src:r.download_url, sha:r.sha,
                 takeover: parseTakeover(r.name),
                 until: parseUntil(r.name) }));
}

/* Identity must include the name, not just the blob. A rename keeps the
   same content and therefore the same sha, but the name now carries the
   takeover schedule, so a rename is a real change. */
const signature = list => list.map(p => p.name + '@' + p.sha).join('|');

function preload(list) {
  return Promise.all(list.filter(p => p.kind !== 'video').map(p => new Promise(resolve => {
    const img = new Image();
    const deadline = setTimeout(resolve, 8000);
    img.onload = () => { clearTimeout(deadline); p.w = img.naturalWidth; p.h = img.naturalHeight; resolve(); };
    img.onerror = () => { clearTimeout(deadline); resolve(); };
    img.src = p.src;
  })));
}

async function poll(applyNow) {
  try {
    const next = await fetchPosters();
    lastError = null;
    if (!playing || signature(next) !== signature(remote)) {
      await preload(next);
      remote = next;
      applyState(applyNow);
    } else {
      scheduleTransition();   // file list unchanged, but clocks may have moved
    }
  } catch (err) {
    lastError = err.message;
    console.warn('Poster check failed:', err.message);
    if (!playing) start(buildQueue());   // a failed check must never blank the wall
  }
  if (trayOpen()) renderTray();
}

function buildQueue(now) {
  now = now || Date.now();

  /* A live takeover owns the screen outright: no posters, no newsletter.
     Several at once rotate among themselves and nothing else. */
  const live = remote.filter(p => takeoverLive(p.takeover, now));
  if (live.length) return live;

  /* Takeover files that have not started, or have expired, stay out of the
     normal rotation entirely rather than showing as ordinary posters. So do
     ordinary posters that have passed their own -until time. */
  const q = remote.filter(p => !p.takeover && !expired(p, now));
  if (newsletterOn) q.push(NEWSLETTER);   // always last
  return q;
}

const queueSig = q => q.map(p => p.kind === 'newsletter' ? 'NEWSLETTER' : p.name + '@' + p.sha).join('|');

/* Recompute what should be on screen now and move to it if that differs.
   Called by the poll, by the clock when a takeover starts or ends, and
   whenever the newsletter is toggled. */
function applyState(applyNow) {
  const next = buildQueue();

  if (!playing || queueSig(next) !== queueSig(queue)) {
    if (playing && !applyNow && panes.length > 1) pending = next;
    else start(next);
  } else if (pending) {
    pending = null;                       // a queued change that is now moot
  }

  scheduleTransition();
  if (trayOpen()) renderTray();
}

/* Takeovers start and end on the clock, not on the polling interval, so the
   next boundary gets its own timer and fires on time. Capped so a distant
   date is re-evaluated periodically rather than trusted to one long timer. */
let transitionTimer = null;
function scheduleTransition() {
  clearTimeout(transitionTimer);
  transitionTimer = null;

  const now = Date.now();
  let soonest = Infinity;
  for (const p of remote) {
    if (p.until !== null && p.until !== undefined && p.until > now)
      soonest = Math.min(soonest, p.until);
    if (!p.takeover) continue;
    const { start: s, end: e } = p.takeover;
    if (s !== null && s > now) soonest = Math.min(soonest, s);
    if (e !== null && e > now) soonest = Math.min(soonest, e);
  }
  if (soonest === Infinity) return;

  const delay = Math.min(soonest - now + 250, 6 * 3600 * 1000);
  transitionTimer = setTimeout(() => applyState(true), Math.max(delay, 250));
}

/* ---------- the loop -------------------------------------------------- */

let stopActiveVideo = null;
let slideGeneration = 0;
const VIDEO_STALL_MS = 20000;

function stopMedia() {
  slideGeneration++;
  clearTimeout(timer); timer = null;
  if (stopActiveVideo) { stopActiveVideo(); stopActiveVideo = null; }
}

function start(next) {
  stopMedia();
  queue = next; pending = null; index = 0;
  const stage = $('stage');
  stage.innerHTML = '';
  panes = [];
  if (!queue.length) {
    playing = false;
    $('status').classList.remove('gone');
    $('status').textContent = lastError || 'No media yet. Add images or MP4 videos to the posters folder in GitHub.';
    return;
  }
  $('status').classList.add('gone');
  panes = queue.map(p => {
    const pane = document.createElement('div');
    pane.className = 'slide';
    if (p.kind === 'newsletter') pane.appendChild(newsletterEl());
    else if (p.kind === 'video') {
      const video = document.createElement('video');
      video.muted = true; video.defaultMuted = true;
      video.setAttribute('muted', ''); video.setAttribute('playsinline', '');
      video.preload = 'none'; video.loop = false;
      video.setAttribute('aria-label', p.name);
      pane.appendChild(video);
    } else {
      const img = document.createElement('img'); img.src = p.src;
      pane.appendChild(img);
    }
    stage.appendChild(pane);
    return pane;
  });
  fitNewsletters();
  playing = true;
  showCurrent();
}

function showCurrent() {
  stopMedia();
  panes.forEach((pane, i) => pane.classList.toggle('vis', i === index));
  const p = queue[index];
  const video = panes[index].querySelector('video');
  if (!video) { if (panes.length > 1 || pending) timer = setTimeout(advance, holdMs()); return; }
  const generation = slideGeneration;
  let watchdog, finished = false, lastPosition = -1, lastProgress = Date.now();
  const active = () => generation === slideGeneration && !finished;
  const finish = (failed) => {
    if (!active()) return;
    finished = true;
    clearInterval(watchdog);
    if (failed) { p.playbackError = 'Could not play; skipped and will retry next cycle.'; console.warn(p.name, p.playbackError); }
    // Avoid a tight retry loop if an unplayable video is the only item.
    timer = setTimeout(advance, failed && panes.length === 1 ? holdMs() : 0);
  };
  video.onended = () => finish(false);
  video.onerror = () => finish(true);
  video.onloadedmetadata = () => { p.w = video.videoWidth; p.h = video.videoHeight; p.duration = video.duration; };
  video.onplaying = () => { delete p.playbackError; lastProgress = Date.now(); };
  stopActiveVideo = () => {
    finished = true; clearInterval(watchdog);
    video.onended = video.onerror = video.onloadedmetadata = video.onplaying = null;
    video.pause(); video.removeAttribute('src'); video.load();
  };
  video.muted = true; video.src = p.src;
  watchdog = setInterval(() => {
    if (!active()) return;
    if (video.currentTime > lastPosition + 0.05) { lastPosition = video.currentTime; lastProgress = Date.now(); }
    if (Date.now() - lastProgress > VIDEO_STALL_MS) finish(true);
  }, 1000);
  try {
    const result = video.play();
    if (result && result.catch) result.catch(() => finish(true));
  } catch (_) { finish(true); }
}

function advance() {
  if (!panes.length) return;
  const nextIndex = (index + 1) % panes.length;
  if (nextIndex === 0 && pending) { const next = pending; start(next); return; }
  index = nextIndex;
  showCurrent();
}

/* ---------- mouse-reveal controls -------------------------------------- */

let idleTimer = null;
function wake() {
  document.body.classList.add('awake');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.remove('awake'), IDLE_MS);
}
document.addEventListener('mousemove', wake);
document.addEventListener('mousedown', wake);
document.addEventListener('keydown', wake);
document.addEventListener('touchstart', wake, {passive:true});

/* ---------- tray -------------------------------------------------------- */

const trayOpen = () => $('tray').classList.contains('on');
function openTray()  { $('tray').classList.add('on'); renderTray(); }
function closeTray() { $('tray').classList.remove('on'); }

function renderTray() {
  const grid = $('grid');
  grid.innerHTML = '';
  remote.forEach(p => grid.appendChild(card(p, false)));
  grid.appendChild(card(NEWSLETTER, true));
  fitNewsletters();

  $('hold').value = holdSec;
  const onAir = remote.filter(p => takeoverLive(p.takeover, Date.now()));
  if (onAir.length) {
    $('count').textContent = onAir.length === 1
      ? `Takeover on air, posters and newsletter paused`
      : `${onAir.length} takeovers on air; videos play in full, everything else paused`;
  } else {
    const live = remote.filter(p => !p.takeover && !expired(p, Date.now())).length + (newsletterOn ? 1 : 0);
    $('count').textContent = live ? `${live} in rotation; images ${holdSec}s, videos play in full (silent)` : 'Nothing to play yet';
  }

  const bits = [`Images and videos come from the <b>${REPO.dir}</b> folder in <b>${REPO.owner}/${REPO.name}</b>. ` +
    `Add or delete files there from any computer. This screen checks every ${POLL_MS/60000} minutes ` +
    `and changes take effect at the end of the current cycle.`];
  if (pending)   bits.push('A change is waiting and will apply when this cycle finishes.');
  if (lastError) bits.push(`<span class="err">Last check failed: ${lastError}</span>`);
  $('trayNote').innerHTML = bits.join('<br>');
}

function card(p, isNewsletter) {
  const el = document.createElement('div');
  el.className = 'card' + (isNewsletter ? ' pinned' : '') +
    ((isNewsletter && !newsletterOn) || (!isNewsletter && expired(p, Date.now())) ? ' off' : '');

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (isNewsletter) thumb.appendChild(newsletterEl());
  else if (p.kind === 'video') { thumb.textContent = 'Video · silent · plays in full'; thumb.style.color = '#F5ECE4'; }
  else { const img = document.createElement('img'); img.src = p.src; thumb.appendChild(img); }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<p class="name">${esc(p.name)}</p>` +
    `<p class="dims">${isNewsletter ? '2:1, drawn to fit' : (p.w && p.h ? p.w+' × '+p.h : p.kind) + shape(p)}</p>` +
    takeoverNote(p) + (p.playbackError ? '<p class="err">' + esc(p.playbackError) + '</p>' : '');
  if (!isNewsletter && takeoverLive(p.takeover, Date.now())) el.classList.add('live');

  el.append(thumb, meta);

  if (isNewsletter) {
    const acts = document.createElement('div');
    acts.className = 'acts';
    const b = document.createElement('button');
    b.className = 'b';
    b.textContent = newsletterOn ? 'In rotation' : 'Out of rotation';
    b.onclick = () => {
      newsletterOn = !newsletterOn;
      prefs.set('moca.newsletter', newsletterOn ? 'on' : 'off');
      applyState();                 // applies at the cycle boundary like any other change
      renderTray();
    };
    acts.appendChild(b);
    const badge = document.createElement('p');
    badge.className = 'pinbadge';
    badge.textContent = 'Always plays last';
    el.append(acts, badge);
  }
  return el;
}

/* Plain-language state for a takeover file, so what the screen is about to
   do is readable at a glance rather than inferred from the filename. */
function takeoverNote(p) {
  const tk = p.takeover;
  if (!tk) {
    if (p.until === null || p.until === undefined) return '';
    return Date.now() >= p.until
      ? `<p class="tk off">Came down ${fmtSyd(p.until)}. Safe to delete.</p>`
      : `<p class="tk off">Comes down ${fmtSyd(p.until)}</p>`;
  }
  const now = Date.now();
  if (tk.start !== null && now < tk.start)
    return `<p class="tk off">Takeover, waiting until ${fmtSyd(tk.start)}` +
           (tk.end !== null ? ` then until ${fmtSyd(tk.end)}` : '') + `</p>`;
  if (tk.end !== null && now >= tk.end)
    return `<p class="tk off">Takeover, expired ${fmtSyd(tk.end)}. Safe to delete.</p>`;
  return `<p class="tk on">TAKEOVER ON AIR` +
         (tk.end !== null ? `, until ${fmtSyd(tk.end)}` : ', until deleted') + `</p>`;
}

function shape(p) {
  if (!p.w || !p.h) return '';
  const r = p.w/p.h, near = (a,b) => Math.abs(a-b) < .03;
  if (near(r,2)) return ' · 2:1';
  if (near(r,16/9)) return ' · 16:9, fills the screen';
  if (r < 1) return ' · portrait, bars at the sides';
  return '';
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('manageBtn').onclick = openTray;
$('resumeBtn').onclick = closeTray;

/* Takes effect from the next poster, so the one on screen is never cut. */
$('hold').addEventListener('change', e => {
  holdSec = clampHold(e.target.value);
  e.target.value = holdSec;
  prefs.set('moca.hold', holdSec);
  renderTray();
});

$('refreshBtn').onclick = async () => {
  const b = $('refreshBtn');
  b.disabled = true; b.textContent = 'Checking…';
  await poll(true);
  b.disabled = false; b.textContent = 'Check for changes now';
};

/* ---------- boot --------------------------------------------------------- */

/* No Play button: in kiosk mode the window is already full screen, so the
   loop starts on its own and the machine needs nobody after a restart. */
if (LOCAL_PREVIEW) document.title = 'TEST ONLY - MOCA video rotation';
poll(true);
setInterval(poll, POLL_MS);

setTimeout(() => location.reload(), msUntil(4));   // nightly refresh
function msUntil(h) {
  const now = new Date(), next = new Date(now);
  next.setHours(h,0,0,0);
  if (next <= now) next.setDate(next.getDate()+1);
  return next - now;
}
</script>

</body>
